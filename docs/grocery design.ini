# 28. Very important: don't couple "Purchase" and "Expense"

A grocery purchase is technically an expense from a cash-flow perspective, but keeping the entities separate gives you better reporting.

For example:

```text
Purchase
₹5,000 groceries
Vendor: Metro Foods
Items: Chicken, vegetables, oil
```

and:

```text
Expense
₹12,000
Category: Electricity
```

Then your financial reporting layer can aggregate both.

