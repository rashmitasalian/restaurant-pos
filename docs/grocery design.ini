# 17. Even better: distinguish procurement from consumption

This is something I'd design for now, even if you implement it later.

Suppose:

```text
Opening grocery inventory     ₹10,000
+ Purchases                   ₹30,000
- Closing inventory            ₹8,000
────────────────────────────────
Estimated grocery consumption ₹32,000
```

That's closer to the actual food cost than simply using purchases.

Eventually:

```text
Food Cost
=
Opening Inventory
+ Purchases
- Closing Inventory
```

Then:

```text
Gross Profit
=
Sales
- Food Cost
```

And:

```text
Operating Profit
=
Gross Profit
- Operating Expenses
```

You don't necessarily need full inventory management in your first release, but **don't architect Grocery in a way that prevents this later.**

