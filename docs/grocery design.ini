Yes. I would **change the mental model of the Grocery section**, not just modernize the current screen.

Your current screen is trying to do three different jobs in one workflow:

1. **Plan what to buy**
2. **Record what was actually purchased**
3. **Use grocery spend to infer profit**

Those should be related, but they should not be treated as the same thing.

The biggest conceptual correction is this:

> **Grocery spend is a procurement/cost metric. It is not “actual profit.”**

Actual restaurant profitability needs grocery + salaries + rent + electricity + maintenance + other operating expenses, etc.

For RestoNiti, I'd build Grocery as a small **Procurement & Cost Management module**.

