### Phase 3

This is where it can become a real restaurant financial system:

```text
Inventory
     ↓
Purchases
     ↓
Consumption
     ↓
Food Cost
     ↓
Gross Profit
     ↓
Operating Expenses
     ↓
Operating Profit
