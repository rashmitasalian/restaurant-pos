# 29. Database document strategy

Given your existing PouchDB-style document architecture, I would use predictable prefixes:

```text
buying-list:<uuid>
buying-list-item:<uuid>

grocery-item:<uuid>

vendor:<uuid>

purchase:<uuid>
purchase-item:<uuid>

expense:<uuid>
```

And maintain a `type` field.

For example:

```json
{
  "_id": "buying-list:8f2...",
  "type": "buyingList",
  "name": "Morning Procurement",
  "date": "2026-08-26",
  "status": "completed"
}
```

This also makes future CouchDB/cloud replication much cleaner.

---

# 30. Cloud-readiness

Since RestoNiti will eventually have cloud integration, **don't design the new Grocery feature as a collection of UI-only local states**.

Every important record should have:

```text
id
restaurantId
createdAt
updatedAt
createdBy
updatedBy
version
```

and preferably:

```text
deletedAt
```

for soft deletion where appropriate.

For example:

```text
vendor:abc123
purchase:def456
buying-list:xyz789
```

can later replicate cleanly.

Also, don't use:

```text
26 Aug + "Morning"
```

as a database key.

Use UUIDs and keep the human-readable name separate.

