# 7. Planned vs Purchased

This is an important enterprise-level distinction.

Suppose you planned:

```text
Chicken     10 kg    ₹2,200
```

but bought:

```text
Chicken      8 kg    ₹1,920
```

You want to know:

```text
Planned:     10 kg / ₹2,200
Purchased:    8 kg / ₹1,920
Pending:      2 kg
Variance:   -₹280
```

This gives you much more useful procurement information.

