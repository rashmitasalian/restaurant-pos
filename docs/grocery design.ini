# 14. The biggest change: remove "Actual Profit" from Grocery

This is where I strongly recommend changing your current design.

Your current idea appears to be something like:

```text
Sales
-
Grocery Spend
=
Profit
```

That is **not profit**.

It is closer to:

> **Sales after grocery procurement**

And even that can be misleading because procurement spend isn't necessarily equal to consumption.

For example:

```text
Sales                    ₹1,00,000
Grocery purchases          ₹30,000
```

You can't necessarily say:

> Profit = ₹70,000

because you may have:

```text
Salary                 ₹20,000
Electricity             ₹5,000
Rent                   ₹10,000
Maintenance             ₹3,000
Packaging               ₹2,000
Other expenses          ₹2,000
```

