# 35. What I would build for the first release

Don't try to implement full inventory/accounting immediately.

### Phase 1 — absolutely worth doing

**Grocery**

* Multiple buying lists per day
* Draft/Open/Completed states
* List history
* Duplicate previous list
* Reusable grocery items
* Printable lists
* Purchase recording
* Vendor master
* Purchase history
* Planned vs actual purchase amount
* Search/filter
* Audit trail

**Expenses**

* Add expense
* Categories
* Expense history
* Date/category filters

**Reporting**

* Grocery spend
* Total expenses
* Sales
* Contribution/profitability estimate
* Expense breakdown

