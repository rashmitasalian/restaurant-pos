<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RestoNiti</title>
    <script>
      (function () {
        try {
          var choice = localStorage.getItem("pos-appearance");
          var theme = "light";
          if (choice === "dark") theme = "dark";
          else if (
            choice === "system" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
          ) {
            theme = "dark";
          }
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      body {
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Roboto",
          "Helvetica Neue",
          Arial,
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background: #f9f8f6;
        color: #17202a;
      }
      /* Pre-React splash — mirrors PageLoadingFallback auth variant */
      .boot {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 32px;
      }
      .boot-brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .boot-mark {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        background: linear-gradient(135deg, #0f5e68, #0b4a52);
        box-shadow: 0 10px 24px rgba(15, 94, 104, 0.28);
        animation: boot-pulse 1.4s ease-in-out infinite;
      }
      .boot-wordmark {
        display: flex;
        gap: 2px;
        font-size: 28px;
        font-weight: 800;
        letter-spacing: -0.03em;
      }
      .boot-wordmark span:last-child {
        color: #0f5e68;
      }
      .boot-track {
        width: min(220px, 70vw);
        height: 4px;
        border-radius: 999px;
        background: #f4f5f3;
        overflow: hidden;
      }
      .boot-bar {
        width: 42%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #0f5e68, #5f9ea5);
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      .boot-caption {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: #64748b;
      }
      @keyframes boot-slide {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(280%);
        }
      }
      @keyframes boot-pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(0.96);
          opacity: 0.88;
        }
      }
      html[data-theme="dark"] body {
        background: #1c2124;
        color: #e8e6e1;
      }
      html[data-theme="dark"] .boot-mark {
        background: linear-gradient(135deg, #6eafb8, #3d7f88);
      }
      html[data-theme="dark"] .boot-wordmark span:last-child {
        color: #6eafb8;
      }
      html[data-theme="dark"] .boot-track {
        background: #1a1f22;
      }
      html[data-theme="dark"] .boot-bar {
        background: linear-gradient(90deg, #6eafb8, #8ac6ce);
      }
      html[data-theme="dark"] .boot-caption {
        color: #9aa3a1;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-live="polite">
        <div class="boot-brand">
          <span class="boot-mark" aria-hidden="true"></span>
          <div class="boot-wordmark"><span>Resto</span><span>Niti</span></div>
        </div>
        <div class="boot-track" aria-hidden="true"><div class="boot-bar"></div></div>
        <p class="boot-caption">Starting RestoNiti</p>
      </div>
    </div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
