<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#0f5e68" />
    <script>
      (function () {
        try {
          var choice = localStorage.getItem("pos-appearance");
          var theme = "light";
          if (choice === "dark") theme = "dark";
          else if (
            choice === "system" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
          ) {
            theme = "dark";
          }
          document.documentElement.setAttribute("data-theme", theme);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", theme === "dark" ? "#12383d" : "#0f5e68");
        } catch (e) {}
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RestoNiti" />
    <link rel="manifest" href="/captain/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/captain/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/captain/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/captain/icons/icon-512.png" />
    <title>RestoNiti</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
